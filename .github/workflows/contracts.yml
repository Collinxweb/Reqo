name: Contract tests

on:
  push:
    branches: [v5-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned dependencies
        run: |
          mkdir -p lib
          git clone --depth 1 --branch v1.9.6 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.0.2 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Build
        run: forge build

      - name: V5 deployed bytecode size gate
        run: |
          set -euo pipefail
          for contract in MemeFactoryV5 PoolV5; do
            hex=$(forge inspect "$contract" deployedBytecode)
            hex=${hex#0x}
            [[ "$hex" =~ ^[0-9a-fA-F]+$ ]] || {
              echo "Invalid bytecode for $contract"
              exit 1
            }
            bytes=$((${#hex} / 2))
            echo "$contract deployed bytecode: $bytes bytes"
            if (( bytes > 24576 )); then
              echo "FAIL: exceeds EIP-170 limit"
              exit 1
            fi
          done

      - name: Test
        run: forge test -vvv
