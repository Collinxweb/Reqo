<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QoreX signing test</title>
<style>body{font-family:system-ui;background:#0a0c0b;color:#f2f5f3;padding:16px;max-width:760px;margin:auto}
button{padding:14px;border-radius:999px;border:0;background:#c6ff1a;color:#0a0c0b;font-weight:800;width:100%;margin:8px 0}
pre{background:#13161a;padding:12px;border-radius:12px;white-space:pre-wrap;word-break:break-all;font-size:12px}</style></head>
<body>
<h3>QoreX signing test</h3>
<p>Signs the test message <code>hello qorechain</code> with the connected account's ML-DSA-87 key, through QoreX. Nothing is sent to the chain.</p>
<button id="conn">1. Connect QoreX</button>
<button id="sign" disabled>2. Sign test message</button>
<p id="env"></p><h4>Result</h4><pre id="out">Not run yet.</pre><button id="save" disabled>3. Save signature file</button>
<script>
const env = document.getElementById("env");
env.textContent = "Page origin: " + location.origin + " | window.qorex: " + (window.qorex ? "present" : "NOT present") + " | native: " + (window.qorex && window.qorex.native ? "present" : "NOT present");
const out = (t) => { document.getElementById("out").textContent = t; };
const b64ToHex = (b64) => "0x" + [...atob(b64)].map(c => c.charCodeAt(0).toString(16).padStart(2, "0")).join("");
let acct = null;
let pqHex = null;
document.getElementById("conn").onclick = async () => {
  try {
    if (!window.qorex || !window.qorex.native) return out("QoreX native provider not found. Open this page in the browser where QoreX is installed.");
    await window.qorex.native.enable("qorechain-diana");
    const k = await window.qorex.native.getKey("qorechain-diana");
    acct = k.bech32Address;
    document.getElementById("sign").disabled = false;
    out("Connected: " + acct);
  } catch (e) { out("Connect failed: " + (e && e.message ? e.message : String(e))); }
};
document.getElementById("sign").onclick = async () => {
  try {
    const data = new TextEncoder().encode("hello qorechain");
    const sig = await window.qorex.native.signArbitrary("qorechain-diana", acct, data);
    const pq = sig && sig.pq ? sig.pq.signature : null;
    pqHex = pq ? b64ToHex(pq) : null;
    document.getElementById("save").disabled = !pqHex;
    out(JSON.stringify(sig, null, 2) +
      "\n\nPQ signature length (bytes): " + (pq ? atob(pq).length : "n/a"));
  } catch (e) { out("Sign failed: " + (e && e.message ? e.message : String(e))); }
};
document.getElementById("save").onclick = () => {
  const blob = new Blob([pqHex.slice(2)], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reqo-pq-sig.hex";
  a.click();
  out("Saved reqo-pq-sig.hex (" + (pqHex.length - 2) / 2 + " bytes). Check your Downloads folder.");
};
</script></body></html>
